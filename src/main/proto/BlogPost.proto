syntax = "proto3";

package proto.davisellwood.website.models;

import "google/protobuf/timestamp.proto";

message BlogPost {
    string blogId = 1;
    string title = 2;
    string contentFilePath = 3;
    bool isPublic = 4;
    google.protobuf.Timestamp publishDate = 5;
    google.protobuf.Timestamp lastEdited = 6;
}

message BlogPostMap {
    map<string, BlogPost> posts = 1;
}