<!doctype html>
<html lang="en">
  <head>
    <title>Davis | Blog</title>
    <meta name="description" content="The blog for davisellwood.com is currently unavailable">
    <!--/*/ <th:block th:insert="~{fragments/main.html :: headerfiles}"> </th:block> /*/-->
  </head>
  <body>
    <header th:replace="~{fragments/main.html :: header}"></header>
    <div class="container"><div class="row justify-content-center"><div class="col-xxl-6 col-lg-8 col-md-10 col-sm-12"><div class="list-group">
      <th:block th:each="post: ${posts}">
        <div class="list-group-item list-group-item-action" aria-current="true">
          <div class="d-flex w-100 justify-content-between">
            <h3 class="mb-1"><a th:href="@{~/blog/view/{id}(id=${post.id})}" th:text="${post.title}"></a></h3>
            <small th:text="${post.publishDate}"></small>
          </div>
          <p class="mb-1">A little description or something.</p>
        </div>
      </th:block>
    </div></div></div></div>
    <footer>
      <!--/*/ <th:block th:insert="~{fragments/main.html :: footer}"> </th:block> /*/-->
    </footer>
  </body>
</html>
