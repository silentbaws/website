name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
    - mainline

jobs:
  build-push-deploy-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          cache: maven
          distribution: corretto
      - name: Log in to the Container registry
        uses: docker/login-action@v3.3.0
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DIGITAL_OCEAN_USER }}
          password: ${{ secrets.DIGITAL_OCEAN_API_KEY }}
      - name: Maven Build
        run: ./mvnw spring-boot:build-image -DimageName=registry.digitalocean.com/davisellwoodwebsite/website:latest
      - name: docker push
        run:
          docker push registry.digitalocean.com/davisellwoodwebsite/website:latest
